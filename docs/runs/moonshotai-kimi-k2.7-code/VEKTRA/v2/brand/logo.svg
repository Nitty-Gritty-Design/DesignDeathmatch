<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" width="260" height="57">
  <title>VEKTRA v2 logo</title>
  <defs>
    <mask id="v2-ring-mask">
      <rect width="100%" height="100%" fill="white"/>
      <circle cx="24" cy="20" r="2.2" fill="black"/>
    </mask>
  </defs>
  <g fill="none" stroke="#F7F7F5" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Crossbar segments -->
    <line x1="8" y1="20" x2="18" y2="20" />
    <line x1="30" y1="20" x2="40" y2="20" />
    <!-- V legs -->
    <line x1="8" y1="8" x2="24" y2="40" />
    <line x1="40" y1="8" x2="24" y2="40" />
  </g>
  <!-- Ring node -->
  <circle cx="24" cy="20" r="5" fill="none" stroke="#F7F7F5" stroke-width="3" mask="url(#v2-ring-mask)" />
  <!-- Logotype -->
  <text x="58" y="31" font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.02em" fill="#F7F7F5">VEKTRA</text>
</svg>
