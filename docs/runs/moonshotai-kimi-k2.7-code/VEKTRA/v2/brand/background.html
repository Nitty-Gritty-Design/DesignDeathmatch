<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEKTRA v2 — Signal Field</title>
  <!--
    Wildcard 6.1 v2 — Generative animated background
    Rationale: The signal field is the purest expression of VEKTRA's identity.
    This standalone version adds a drifting grid, constellation nodes, a scanning
    sweep line, and mouse-responsive wave distortion. It uses only the Canvas 2D
    API and requestAnimationFrame to stay lightweight and tunable.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--v2-color-bg-primary);
      color: var(--v2-color-text-primary);
      font-family: var(--v2-font-sans);
    }
    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: fixed;
      left: var(--v2-space-7);
      bottom: var(--v2-space-7);
      z-index: 10;
      pointer-events: none;
    }
    .overlay h1 {
      margin: 0;
      font-size: var(--v2-text-3xl);
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .overlay p {
      margin: var(--v2-space-2) 0 0;
      font-family: var(--v2-font-mono);
      font-size: var(--v2-text-xs);
      color: var(--v2-color-text-muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .controls {
      position: fixed;
      right: var(--v2-space-7);
      bottom: var(--v2-space-7);
      z-index: 10;
      display: flex;
      gap: var(--v2-space-3);
    }
    .controls button {
      pointer-events: auto;
      padding: var(--v2-space-2) var(--v2-space-4);
      font-family: var(--v2-font-mono);
      font-size: var(--v2-text-xs);
      background: rgba(var(--v2-color-bg-primary-rgb), 0.8);
      color: var(--v2-color-text-primary);
      border: 1px solid var(--v2-color-border);
      cursor: crosshair;
      backdrop-filter: var(--v2-blur-sm);
      transition: border-color var(--v2-transition-base), color var(--v2-transition-fast);
    }
    .controls button:hover {
      border-color: var(--v2-color-accent);
      color: var(--v2-color-accent);
    }
    @media (max-width: 640px) {
      .overlay { left: var(--v2-space-5); bottom: var(--v2-space-5); }
      .controls { right: var(--v2-space-5); bottom: var(--v2-space-5); }
    }
  </style>
</head>
<body>
  <canvas id="signal-field" aria-hidden="true"></canvas>
  <div class="overlay">
    <h1>Signal field</h1>
    <p>Move cursor to disturb the graph · 60 fps · Canvas 2D</p>
  </div>
  <div class="controls">
    <button id="pause-btn" type="button">Pause</button>
    <button id="reset-btn" type="button">Reset</button>
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('signal-field');
      const ctx = canvas.getContext('2d');
      const styles = getComputedStyle(document.documentElement);
      const css = (name) => styles.getPropertyValue(name).trim();

      const state = {
        accent: css('--v2-color-accent'),
        accentDeep: css('--v2-color-accent-deep'),
        muted: css('--v2-color-text-muted'),
        border: css('--v2-color-border'),
        bg: css('--v2-color-bg-primary'),
      };

      let width, height, dpr;
      let time = 0;
      let running = true;
      let rafId = null;

      const mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
      let prevMouse = { x: -1000, y: -1000 };

      const grid = { cols: 16, rows: 12, points: [] };
      const nodes = Array.from({ length: 9 }, (_, i) => ({
        idx: i,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.5,
        radius: 2 + Math.random() * 2,
      }));

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.floor(width * dpr);
        canvas.height = Math.floor(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        initGrid();
      }

      function initGrid() {
        grid.points.length = 0;
        for (let y = 0; y <= grid.rows; y++) {
          for (let x = 0; x <= grid.cols; x++) {
            grid.points.push({
              x: x / grid.cols,
              y: y / grid.rows,
              phase: Math.random() * Math.PI * 2,
              speed: 0.25 + Math.random() * 0.35,
            });
          }
        }
      }

      function prefersReducedMotion() {
        return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      }

      function drawGrid() {
        ctx.strokeStyle = state.border;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.15;
        ctx.beginPath();

        for (let i = 0; i < grid.points.length; i++) {
          const p = grid.points[i];
          const dx = Math.sin(time * 0.00025 * p.speed + p.phase) * 14;
          const dy = Math.cos(time * 0.0002 * p.speed + p.phase) * 10;
          const px = p.x * width + dx;
          const py = p.y * height + dy;

          if ((i + 1) % (grid.cols + 1) !== 0) {
            const q = grid.points[i + 1];
            ctx.moveTo(px, py);
            ctx.lineTo(q.x * width + Math.sin(time * 0.00025 * q.speed + q.phase) * 14, q.y * height + Math.cos(time * 0.0002 * q.speed + q.phase) * 10);
          }
          if (i + grid.cols + 1 < grid.points.length) {
            const q = grid.points[i + grid.cols + 1];
            ctx.moveTo(px, py);
            ctx.lineTo(q.x * width + Math.sin(time * 0.00025 * q.speed + q.phase) * 14, q.y * height + Math.cos(time * 0.0002 * q.speed + q.phase) * 10);
          }
        }
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      function drawSignals() {
        const count = 10;
        const baseAmp = height * 0.04;
        const mouseSpeed = Math.hypot(mouse.vx, mouse.vy) * 0.04;

        for (let i = 0; i < count; i++) {
          const yCenter = (height / (count + 1)) * (i + 1);
          const speed = 0.0008 + i * 0.00018;
          const freq = 0.0025 + i * 0.001;
          const phase = i * 1.1;
          const isAccent = i === 5;

          ctx.beginPath();
          ctx.strokeStyle = isAccent ? state.accent : state.muted;
          ctx.globalAlpha = isAccent ? 0.95 : 0.2 + i * 0.035;
          ctx.lineWidth = isAccent ? 2.5 : 1;

          for (let x = 0; x <= width; x += 2) {
            const dist = Math.abs(x - mouse.x);
            const influence = Math.max(0, 1 - dist / 300);
            const amp = baseAmp * (1 + influence * (1.8 + mouseSpeed));
            const wave = Math.sin(x * freq + time * speed + phase) * 0.75 +
                         Math.sin(x * freq * 2.2 + time * speed * 1.3 + phase) * 0.25;
            const y = yCenter + wave * amp * (1 + influence);
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      }

      function drawConstellation() {
        const positions = nodes.map((n) => {
          const t = time * 0.00035 + n.idx * 1.2;
          return {
            x: width * (0.1 + 0.8 * ((n.idx + Math.sin(t)) / nodes.length)),
            y: height * (0.2 + 0.6 * Math.cos(t * 0.6 + n.idx)),
            r: n.radius + Math.sin(time * 0.003 + n.idx) * 0.5,
          };
        });

        ctx.strokeStyle = state.accent;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.14;
        ctx.beginPath();
        for (let i = 0; i < positions.length; i++) {
          for (let j = i + 1; j < positions.length; j++) {
            const d = Math.hypot(positions[i].x - positions[j].x, positions[i].y - positions[j].y);
            if (d < height * 0.32) {
              ctx.moveTo(positions[i].x, positions[i].y);
              ctx.lineTo(positions[j].x, positions[j].y);
            }
          }
        }
        ctx.stroke();

        ctx.globalAlpha = 0.85;
        ctx.fillStyle = state.accent;
        positions.forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;
      }

      function drawSweep() {
        const x = ((time * 0.025) % (width + 240)) - 120;
        const grad = ctx.createLinearGradient(x - 60, 0, x + 60, 0);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.5, state.accent);
        grad.addColorStop(1, 'transparent');

        ctx.fillStyle = grad;
        ctx.globalAlpha = 0.08;
        ctx.fillRect(x - 60, 0, 120, height);
        ctx.globalAlpha = 1;

        ctx.strokeStyle = state.accent;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.2;
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      function drawCursor() {
        if (mouse.x < 0) return;
        ctx.strokeStyle = state.accent;
        ctx.lineWidth = 1;
        ctx.globalAlpha = 0.18;
        ctx.beginPath();
        ctx.moveTo(mouse.x, 0);
        ctx.lineTo(mouse.x, height);
        ctx.moveTo(0, mouse.y);
        ctx.lineTo(width, mouse.y);
        ctx.stroke();

        ctx.fillStyle = state.accent;
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.globalAlpha = 0.25;
        ctx.beginPath();
        ctx.arc(mouse.x, mouse.y, 22, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      function draw() {
        ctx.fillStyle = state.bg;
        ctx.fillRect(0, 0, width, height);
        drawGrid();
        drawSignals();
        drawConstellation();
        drawSweep();
        drawCursor();
      }

      function loop() {
        if (!running) return;
        time += 16;
        draw();
        rafId = requestAnimationFrame(loop);
      }

      window.addEventListener('resize', resize);
      window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
        mouse.vx = e.clientX - prevMouse.x;
        mouse.vy = e.clientY - prevMouse.y;
        prevMouse.x = e.clientX;
        prevMouse.y = e.clientY;
      });
      window.addEventListener('mouseleave', () => {
        mouse.x = -1000;
        mouse.y = -1000;
        mouse.vx = 0;
        mouse.vy = 0;
      });

      document.getElementById('pause-btn').addEventListener('click', function () {
        running = !running;
        this.textContent = running ? 'Pause' : 'Resume';
        if (running) loop();
      });

      document.getElementById('reset-btn').addEventListener('click', function () {
        time = 0;
        mouse.x = -1000;
        mouse.y = -1000;
        if (!running) {
          running = true;
          document.getElementById('pause-btn').textContent = 'Pause';
          loop();
        }
      });

      resize();
      if (prefersReducedMotion()) draw();
      else loop();
    })();
  </script>
</body>
</html>
