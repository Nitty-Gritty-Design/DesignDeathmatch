<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEKTRA v2 — Animated Logo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #080808;
      --fg: #F7F7F5;
      --accent: #00F5D4;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: "Space Grotesk", sans-serif;
      overflow: hidden;
    }
    .stage {
      width: min(90vw, 420px);
      aspect-ratio: 220 / 48;
      position: relative;
    }
    svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    .stroke {
      stroke-dasharray: 60;
      stroke-dashoffset: 60;
      animation: draw 700ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .cross-left { animation-delay: 0ms; }
    .cross-right { animation-delay: 120ms; }
    .leg-left { animation-delay: 320ms; }
    .leg-right { animation-delay: 420ms; }

    .ring {
      opacity: 0;
      transform-origin: 24px 20px;
      transform: scale(0.4) rotate(-90deg);
      animation: ring-in 550ms cubic-bezier(0.34, 1.56, 0.64, 1) 720ms forwards;
    }

    .word {
      opacity: 0;
      clip-path: inset(0 100% 0 0);
      animation: reveal 650ms cubic-bezier(0.22, 1, 0.36, 1) 1050ms forwards;
    }

    .pulse {
      opacity: 0;
      transform-origin: 24px 20px;
      animation: pulse 600ms cubic-bezier(0.16, 1, 0.3, 1) 1150ms forwards;
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes ring-in {
      to { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes reveal {
      to { opacity: 1; clip-path: inset(0 0 0 0); }
    }
    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(1); }
      60% { opacity: 0; transform: scale(2.2); }
      100% { opacity: 0; transform: scale(2.4); }
    }
  </style>
</head>
<body>
  <div class="stage">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" aria-label="VEKTRA">
      <defs>
        <mask id="v2-ring-mask">
          <rect width="100%" height="100%" fill="white"/>
          <circle cx="24" cy="20" r="2.2" fill="black"/>
        </mask>
      </defs>
      <g fill="none" stroke="#F7F7F5" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
        <line class="stroke cross-left" x1="8" y1="20" x2="18" y2="20" />
        <line class="stroke cross-right" x1="30" y1="20" x2="40" y2="20" />
        <line class="stroke leg-left" x1="8" y1="8" x2="24" y2="40" />
        <line class="stroke leg-right" x1="40" y1="8" x2="24" y2="40" />
      </g>
      <circle class="ring" cx="24" cy="20" r="5" fill="none" stroke="#F7F7F5" stroke-width="3" mask="url(#v2-ring-mask)" />
      <circle class="pulse" cx="24" cy="20" r="5" fill="none" stroke="#00F5D4" stroke-width="1.5" />
      <text class="word" x="58" y="31" font-family="Space Grotesk, sans-serif" font-size="26" font-weight="500" letter-spacing="-0.02em" fill="#F7F7F5">VEKTRA</text>
    </svg>
  </div>
</body>
</html>
