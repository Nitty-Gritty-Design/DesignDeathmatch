<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEKTRA — Logo Animation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0D0C0B;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .scene {
      width: 320px; height: 72px;
      position: relative;
    }
    .mark {
      position: absolute; left: 0; top: 0;
      width: 72px; height: 56px;
    }
    .mark path {
      fill: none;
      stroke: #FF4D2A;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-dasharray: 80;
      stroke-dashoffset: 80;
    }
    .wordmark {
      position: absolute; left: 84px; top: 19px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px; font-weight: 500;
      letter-spacing: 0.15em;
      color: #F2F0EB;
      opacity: 0;
      transform: translateY(12px);
    }

    /* Curve 1 - whisper */
    .mark path:nth-child(1) {
      animation: draw-curve 500ms 100ms var(--ease-out-expo, cubic-bezier(0.16,1,0.3,1)) forwards;
    }
    /* Curve 2 - voice */
    .mark path:nth-child(2) {
      animation: draw-curve 520ms 200ms var(--ease-out-expo, cubic-bezier(0.16,1,0.3,1)) forwards,
                 breathe 420ms 750ms var(--ease-out-expo, cubic-bezier(0.16,1,0.3,1)) forwards;
    }
    /* Curve 3 - return */
    .mark path:nth-child(3) {
      animation: draw-curve 480ms 320ms var(--ease-out-expo, cubic-bezier(0.16,1,0.3,1)) forwards,
                 breathe 380ms 820ms var(--ease-out-expo, cubic-bezier(0.16,1,0.3,1)) forwards;
    }
    .wordmark {
      animation: reveal-word 500ms 1050ms var(--ease-out-expo, cubic-bezier(0.16,1,0.3,1)) forwards;
    }

    @keyframes draw-curve {
      to { stroke-dashoffset: 0; }
    }
    @keyframes breathe {
      0%   { transform: scaleY(1); }
      40%  { transform: scaleY(1.18); }
      100% { transform: scaleY(1); }
    }
    @keyframes reveal-word {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <svg class="mark" viewBox="0 0 40 40" width="72" height="56">
      <path d="M4 14 C9 8, 12 3, 16 3 C20 3, 23 8, 28 14"></path>
      <path d="M4 20 C9 8, 12 -1, 16 -1 C20 -1, 23 8, 28 20"></path>
      <path d="M4 26 C9 32, 12 37, 16 37 C20 37, 23 32, 28 26"></path>
    </svg>
    <div class="wordmark">VEKTRA</div>
  </div>
</body>
</html>
