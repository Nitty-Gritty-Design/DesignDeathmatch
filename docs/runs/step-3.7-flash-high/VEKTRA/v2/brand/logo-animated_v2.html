<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEKTRA — Logo Animation v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #08090B;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .scene {
      width: 400px; height: 88px;
      position: relative;
    }

    /* Mark container: centered vertically, positioned left */
    .mark-wrap {
      position: absolute;
      left: 0; top: 50%;
      transform: translateY(-50%);
      width: 68px; height: 68px;
    }

    .mark-wrap svg {
      width: 100%; height: 100%;
      overflow: visible;
    }

    .mark-wrap path {
      fill: none;
      stroke: url(#markGradAnim);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 120;
      stroke-dashoffset: 120;
      filter: drop-shadow(0 0 0px transparent);
    }

    /* Staggered draw */
    .mark-wrap path:nth-child(1) {
      animation: draw 650ms 150ms cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 breathe 480ms 900ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 pulse 600ms 1800ms cubic-bezier(0.76, 0, 0.24, 1) infinite;
    }
    .mark-wrap path:nth-child(2) {
      animation: draw 680ms 350ms cubic-bezier(0.16, 1, 0.3, 1) forwards,
                 breathe 520ms 1100ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                 pulse 700ms 2100ms cubic-bezier(0.76, 0, 0.24, 1) infinite;
    }

    .wordmark {
      position: absolute;
      left: 90px; top: 50%;
      transform: translateY(-50%) translateY(10px);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 22px; font-weight: 600;
      letter-spacing: 0.22em;
      color: #F0EEE9;
      opacity: 0;
      animation: revealWord 600ms 1300ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Sub-line */
    .sub-line {
      position: absolute;
      left: 90px; top: calc(50% + 20px);
      transform: translateY(8px);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 10px; font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #FF5C36;
      opacity: 0;
      animation: revealWord 500ms 1700ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Accent glow ring around mark */
    .glow-ring {
      position: absolute;
      left: -8px; top: -8px;
      width: 84px; height: 84px;
      border-radius: 50%;
      border: 1px solid rgba(255, 92, 54, 0);
      animation: ringIn 700ms 600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes draw {
      to {
        stroke-dashoffset: 0;
        filter: drop-shadow(0 0 3px rgba(255, 92, 54, 0.5));
      }
    }
    @keyframes breathe {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(255, 179, 71, 0.6)); }
    }
    @keyframes revealWord {
      to { opacity: 1; transform: translateY(-50%) translateY(0); }
    }
    @keyframes ringIn {
      to {
        border-color: rgba(255, 92, 54, 0.35);
        box-shadow: 0 0 24px rgba(255, 92, 54, 0.15);
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="glow-ring"></div>
    <div class="mark-wrap">
      <svg viewBox="0 0 24 24" width="68" height="68">
        <defs>
          <linearGradient id="markGradAnim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FF5C36"/>
            <stop offset="100%" stop-color="#FFB347"/>
          </linearGradient>
        </defs>
        <g transform="translate(12, 12) scale(0.75)">
          <path d="
            M 8.09,12.72 C 5.22,11.17 3.12,8.38 2.36,5.00 C 1.60,1.62 2.30,-1.78 4.15,-4.17
            C 6.00,-6.56 8.76,-7.45 11.66,-6.60 C 14.56,-5.75 17.10,-3.17 18.62,-0.03
            C 20.14,3.11 20.42,6.65 19.36,9.82 C 18.30,12.99 16.00,15.42 13.12,16.55
            C 10.24,17.68 7.04,17.41 4.34,15.83 C 1.64,14.25 -0.54,11.51 -1.44,8.33
            C-2.34,5.15 -1.90,1.72 -0.24,-0.77 C 1.42,-3.26 3.82,-5.08 6.66,-5.87
            C 9.50,-6.66 12.51,-6.29 15.12,-4.86 C 17.73,-3.43 19.72,-1.01 20.65,1.77
            C 21.58,4.55 21.36,7.50 20.05,10.11 C 18.74,12.72 16.44,14.72 13.70,15.77
            C 10.96,16.82 7.99,16.76 5.33,15.61 C 2.67,14.46 0.51,12.30 -0.68,9.60
            C-1.87,6.90 -1.81,3.89 -0.52,1.24 C 0.77,-1.41 2.91,-3.50 5.63,-4.70
            C 8.35,-5.90 11.35,-6.10 14.13,-5.25 C 16.91,-4.40 19.15,-2.55 20.49,0.04
            C 21.83,2.63 22.17,5.60 21.37,8.38 C 20.57,11.16 18.68,13.41 16.10,14.72
            C 13.52,16.03 10.48,16.27 7.76,15.35 C 5.04,14.43 2.32,11.93 0.98,9.37 Z
          "/>
        </g>
      </svg>
    </div>
    <div class="wordmark">VEKTRA</div>
    <div class="sub-line">generative instruments</div>
  </div>
</body>
</html>
