<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VEKTRA — Intro Sequence v2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #08090B;
      overflow: hidden;
      font-family: 'IBM Plex Mono', monospace;
    }

    .stage {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column;
    }

    .intro-logo {
      width: 120px; height: 120px;
      margin-bottom: 32px;
      opacity: 0;
      animation: introFadeIn 600ms 300ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .intro-logo svg {
      width: 100%; height: 100%;
      overflow: visible;
    }

    .intro-logo path {
      fill: none;
      stroke: url(#introGrad);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 160;
      stroke-dashoffset: 160;
      animation: introDraw 900ms 500ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .intro-statement {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(28px, 5vw, 48px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #F0EEE9;
      text-align: center;
      opacity: 0;
      transform: translateY(16px);
      animation: introReveal 700ms 1600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      margin-bottom: 12px;
    }

    .intro-sub {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #FF5C36;
      opacity: 0;
      animation: introReveal 500ms 2100ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .skip-btn {
      position: fixed;
      bottom: 28px; right: 32px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #55534F;
      background: transparent;
      border: 1px solid #25282E;
      padding: 8px 14px;
      cursor: crosshair;
      opacity: 0;
      animation: introReveal 400ms 2400ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: color var(--duration-fast, 200ms), border-color var(--duration-fast, 200ms);
      z-index: 10;
    }
    .skip-btn:hover { color: #FF5C36; border-color: #FF5C36; }

    .bg-pulse {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(ellipse at center, rgba(255,92,54,0.04) 0%, #08090B 70%);
      animation: bgPulse 3.5s ease-in-out infinite;
    }

    @keyframes introFadeIn { to { opacity: 1; } }
    @keyframes introDraw { to { stroke-dashoffset: 0; } }
    @keyframes introReveal { to { opacity: 1; transform: translateY(0); } }
    @keyframes bgPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Film grain overlay */
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    @media (max-width: 600px) {
      .intro-logo { width: 80px; height: 80px; margin-bottom: 20px; }
    }
  </style>
</head>
<body>
  <div class="grain"></div>
  <div class="bg-pulse"></div>
  <div class="stage">
    <div class="intro-logo">
      <svg viewBox="0 0 24 24" width="120" height="120">
        <defs>
          <linearGradient id="introGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#FF5C36"/>
            <stop offset="100%" stop-color="#FFB347"/>
          </linearGradient>
        </defs>
        <g transform="translate(12, 12) scale(0.75)">
          <path d="
            M 8.09,12.72 C 5.22,11.17 3.12,8.38 2.36,5.00 C 1.60,1.62 2.30,-1.78 4.15,-4.17
            C 6.00,-6.56 8.76,-7.45 11.66,-6.60 C 14.56,-5.75 17.10,-3.17 18.62,-0.03
            C 20.14,3.11 20.42,6.65 19.36,9.82 C 18.30,12.99 16.00,15.42 13.12,16.55
            C 10.24,17.68 7.04,17.41 4.34,15.83 C 1.64,14.25 -0.54,11.51 -1.44,8.33
            C-2.34,5.15 -1.90,1.72 -0.24,-0.77 C 1.42,-3.26 3.82,-5.08 6.66,-5.87
            C 9.50,-6.66 12.51,-6.29 15.12,-4.86 C 17.73,-3.43 19.72,-1.01 20.65,1.77
            C 21.58,4.55 21.36,7.50 20.05,10.11 C 18.74,12.72 16.44,14.72 13.70,15.77
            C 10.96,16.82 7.99,16.76 5.33,15.61 C 2.67,14.46 0.51,12.30 -0.68,9.60
            C-1.87,6.90 -1.81,3.89 -0.52,1.24 C 0.77,-1.41 2.91,-3.50 5.63,-4.70
            C 8.35,-5.90 11.35,-6.10 14.13,-5.25 C 16.91,-4.40 19.15,-2.55 20.49,0.04
            C 21.83,2.63 22.17,5.60 21.37,8.38 C 20.57,11.16 18.68,13.41 16.10,14.72
            C 13.52,16.03 10.48,16.27 7.76,15.35 C 5.04,14.43 2.32,11.93 0.98,9.37 Z
          "/>
        </g>
      </svg>
    </div>
    <div class="intro-statement">Signal, form, and time.</div>
    <div class="intro-sub">One graph · One medium · Live</div>
    <button class="skip-btn" onclick="window.location.href='../site/index_v2.html'">Enter →</button>
  </div>
</body>
</html>
