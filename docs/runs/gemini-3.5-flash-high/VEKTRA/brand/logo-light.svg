<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&amp;display=swap');
      .logotext {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 24px;
        letter-spacing: 0.18em;
        fill: #151619;
      }
      .logomark {
        fill: none;
        stroke: #85a600;
        stroke-width: 3.5;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .logodot {
        fill: #85a600;
      }
      .divider {
        stroke: #d1d1c7;
        stroke-width: 1.5;
      }
    </style>
  </defs>
  <!-- Background is transparent -->
  <g id="logo-graphic-light">
    <!-- Standalone Mark portion -->
    <path class="logomark" d="M 15 18 L 30 42 L 41 24 L 44 32 L 47 16 L 50 28 L 53 20" />
    <circle class="logodot" cx="57.5" cy="20" r="2.5" />
    
    <!-- Divider Line -->
    <line class="divider" x1="72" y1="12" x2="72" y2="48" />
    
    <!-- Typographic Wordmark -->
    <text class="logotext" x="88" y="37">VEKTRA</text>
  </g>
</svg>
