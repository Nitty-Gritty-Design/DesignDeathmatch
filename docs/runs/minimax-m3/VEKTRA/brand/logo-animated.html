<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEKTRA — signal initializing</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0E0E0C; color: #F4F2EC; }
  body {
    display: grid; place-items: center;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    overflow: hidden;
  }
  .stage { display: flex; align-items: center; gap: 32px; }

  /* mark animation — bars reveal from center outward */
  .mark { display: flex; align-items: center; height: 80px; color: #F4F2EC; }
  .bar  { width: 4px; margin: 0 4px; background: currentColor; border-radius: 1px;
          transform-origin: center; transform: scaleY(0); animation: rise 360ms cubic-bezier(0.16,1,0.3,1) forwards; }
  .bar.accent { background: #FF5C1F; }
  @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  /* per-bar reveal order — center first, then alternating outward */
  .b0,.b12 { animation-delay:   0ms; }
  .b1,.b11 { animation-delay:  60ms; }
  .b2,.b10 { animation-delay: 120ms; }
  .b3,.b9  { animation-delay: 180ms; }
  .b4,.b8  { animation-delay: 240ms; }
  .b5,.b7  { animation-delay: 300ms; }
  .b6      { animation-delay:   0ms; }

  /* wordmark type-in */
  .word {
    font-size: 42px; font-weight: 500; letter-spacing: 0.06em;
    display: inline-flex; overflow: hidden; white-space: nowrap;
  }
  .word span {
    display: inline-block; transform: translateY(100%);
    animation: drop 360ms cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .word span:nth-child(1) { animation-delay: 1400ms; }
  .word span:nth-child(2) { animation-delay: 1450ms; }
  .word span:nth-child(3) { animation-delay: 1500ms; }
  .word span:nth-child(4) { animation-delay: 1550ms; }
  .word span:nth-child(5) { animation-delay: 1600ms; }
  .word span:nth-child(6) { animation-delay: 1650ms; }
  @keyframes drop { to { transform: translateY(0); } }

  .caret {
    display: inline-block; width: 0.6ch; height: 0.9em; background: #FF5C1F;
    margin-left: 0.2ch; transform: translateY(0.15em);
    animation: caret 1ms 2050ms forwards, blink 900ms 2050ms steps(2) infinite;
  }
  @keyframes caret  { from { opacity: 0; } to { opacity: 0; } }
  @keyframes blink   { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

  .meta {
    position: fixed; left: 32px; bottom: 24px; font-size: 11px; letter-spacing: 0.12em;
    color: #6B6960; text-transform: uppercase;
  }
  .meta .dot { color: #FF5C1F; }
  .signal-line {
    position: fixed; left: 0; right: 0; bottom: 0; height: 1px; background: #1D1D18;
  }
</style>
</head>
<body>
  <div class="stage" aria-label="VEKTRA">
    <div class="mark" aria-hidden="true">
      <span class="bar b0"  style="height:4px"></span>
      <span class="bar b1"  style="height:8px"></span>
      <span class="bar b2"  style="height:14px"></span>
      <span class="bar b3"  style="height:22px"></span>
      <span class="bar b4"  style="height:30px"></span>
      <span class="bar b5"  style="height:40px"></span>
      <span class="bar b6 accent" style="height:50px"></span>
      <span class="bar b7"  style="height:40px"></span>
      <span class="bar b8"  style="height:30px"></span>
      <span class="bar b9"  style="height:22px"></span>
      <span class="bar b10" style="height:14px"></span>
      <span class="bar b11" style="height:8px"></span>
      <span class="bar b12" style="height:4px"></span>
    </div>
    <div class="word" aria-label="VEKTRA">
      <span>V</span><span>E</span><span>K</span><span>T</span><span>R</span><span>A</span><span class="caret" aria-hidden="true"></span>
    </div>
  </div>
  <div class="meta"><span class="dot">●</span> &nbsp;SIGNAL&nbsp;·&nbsp;OK&nbsp;·&nbsp;v0.1</div>
  <div class="signal-line"></div>
</body>
</html>
