<?xml version="1.0" encoding="UTF-8"?>
<!--
  VEKTRA — Mark + Logotype
  Seven bars per side of a V formation. Center bar is the signal peak.
  Text uses currentColor so the parent context controls ink color.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" role="img" aria-label="VEKTRA">
  <title>VEKTRA</title>
  <g class="mark" fill="currentColor">
    <!-- left half + center + right half: 13 bars, peak in middle -->
    <rect class="bar" x="8"   y="38" width="4" height="4"  rx="1"/>
    <rect class="bar" x="20"  y="36" width="4" height="8"  rx="1"/>
    <rect class="bar" x="32"  y="33" width="4" height="14" rx="1"/>
    <rect class="bar" x="44"  y="29" width="4" height="22" rx="1"/>
    <rect class="bar" x="56"  y="25" width="4" height="30" rx="1"/>
    <rect class="bar" x="68"  y="20" width="4" height="40" rx="1"/>
    <rect class="bar accent" x="80" y="15" width="4" height="50" rx="1" fill="#FF5C1F"/>
    <rect class="bar" x="92"  y="20" width="4" height="40" rx="1"/>
    <rect class="bar" x="104" y="25" width="4" height="30" rx="1"/>
    <rect class="bar" x="116" y="29" width="4" height="22" rx="1"/>
    <rect class="bar" x="128" y="33" width="4" height="14" rx="1"/>
    <rect class="bar" x="140" y="36" width="4" height="8"  rx="1"/>
    <rect class="bar" x="152" y="38" width="4" height="4"  rx="1"/>
  </g>
  <g class="wordmark" fill="currentColor" font-family="JetBrains Mono, ui-monospace, monospace" font-weight="500" font-size="42" letter-spacing="2.5">
    <text x="184" y="54">VEKTRA</text>
  </g>
</svg>
