<svg width="240" height="60" viewBox="0 0 240 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rectangle for transparency -->
  <rect width="240" height="60" fill="none"/>
  
  <!-- Mark: Signal waveform + vector -->
  <g id="logo-mark" transform="translate(20, 30)">
    <!-- Baseline -->
    <line x1="-40" y1="0" x2="40" y2="0" stroke="var(--color-text-primary)" stroke-width="2"/>
    
    <!-- Upper waveform (simplified sine wave) -->
    <path d="M -40,0 
             C -30,-15 -20,-15 -10,0 
             C 0,15 10,15 20,0 
             C 30,-15 40,-15 50,0"
          fill="none" stroke="var(--color-accent)" stroke-width="2.5"/>
    
    <!-- Lower vector arrow -->
    <polygon points="20,0 50,15 50,-15" 
             fill="var(--color-accent)"/>
  </g>
  
  <!-- Logotype -->
  <text x="90" y="38" font-family="'Space Mono', monospace" font-weight="700" font-size="28" 
        letter-spacing="-0.02em" fill="var(--color-text-primary)">
    VEKTRA
  </text>
</svg>