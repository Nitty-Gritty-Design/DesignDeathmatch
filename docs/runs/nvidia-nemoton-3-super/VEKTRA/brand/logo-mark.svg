<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background rectangle for transparency -->
  <rect width="60" height="60" fill="none"/>
  
  <!-- Mark: Signal waveform + vector -->
  <g id="logo-mark" transform="translate(30, 30)">
    <!-- Baseline -->
    <line x1="-20" y1="0" x2="20" y2="0" stroke="var(--color-text-primary)" stroke-width="2"/>
    
    <!-- Upper waveform (simplified sine wave) -->
    <path d="M -20,0 
             C -15,-10 -10,-10 0,0 
             C 10,10 15,10 20,0 
             C 25,-10 30,-10 40,0"
          fill="none" stroke="var(--color-accent)" stroke-width="2.5"/>
    
    <!-- Lower vector arrow -->
    <polygon points="0,0 25,12 25,-12" 
             fill="var(--color-accent)"/>
  </g>
</svg>