<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEKTRA — Logo Animation v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- GSAP v3 for premium animation sequencing — CSS alone can't achieve this level of choreographed precision -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #08080A;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  .logo-wrap {
    width: 480px;
    height: 100px;
    position: relative;
  }
  .logo-wrap svg { width: 100%; height: 100%; }

  /* Initial hidden states — GSAP will reveal */
  .mark-outer, .mark-inner, .mark-trace, .mark-dot,
  .logotype text { opacity: 0; }
</style>
</head>
<body>
  <div class="logo-wrap">
    <svg viewBox="0 0 480 90" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gOuter" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#4A4740"/>
          <stop offset="100%" stop-color="#EDECEA"/>
        </linearGradient>
        <!-- Glow filter for accent dot -->
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
        <!-- Subtle glow for trace -->
        <filter id="traceGlow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Outer stroke (left wing) -->
      <path class="mark-outer"
        d="M 10 80 L 28 16 Q 34 4 40 16 L 50 42"
        fill="none" stroke="url(#gOuter)" stroke-width="3" stroke-linecap="round"/>

      <!-- Inner stroke (right wing) -->
      <path class="mark-inner"
        d="M 50 42 L 60 16 Q 66 4 72 16 L 90 80"
        fill="none" stroke="#EDECEA" stroke-width="3" stroke-linecap="round"/>

      <!-- Signal trace (center waveform) -->
      <path class="mark-trace"
        d="M 20 62 Q 28 56 34 42 Q 40 28 46 20 Q 50 16 54 20 Q 60 28 66 42 Q 72 56 80 62"
        fill="none" stroke="#FF5E1A" stroke-width="2" stroke-linecap="round" filter="url(#traceGlow)"/>

      <!-- Peak dot with glow -->
      <circle class="mark-dot"
        cx="50" cy="14" r="4" fill="#FF5E1A" filter="url(#glow)"/>

      <!-- Logotype -->
      <g class="logotype">
        <text x="118" y="58" font-family="'JetBrains Mono', monospace" font-size="30" font-weight="700" fill="#EDECEA" letter-spacing="5">
          <tspan class="char">V</tspan><tspan class="char">E</tspan><tspan class="char">K</tspan><tspan class="char">T</tspan><tspan class="char">R</tspan><tspan class="char">A</tspan>
        </text>
      </g>
    </svg>
  </div>

  <script>
    // VEKTRA logo animation — GSAP timeline
    // Phase 1: Strokes draw in with staggered timing
    // Phase 2: Signal trace sweeps across with glow
    // Phase 3: Peak dot pulses with bloom
    // Phase 4: Logotype types in character by character
    var tl = gsap.timeline({ defaults: { ease: 'expo.out' } });

    // Stroke draw-in via stroke-dashoffset
    var outer = document.querySelector('.mark-outer');
    var inner = document.querySelector('.mark-inner');
    var trace = document.querySelector('.mark-trace');
    var dot = document.querySelector('.mark-dot');
    var chars = document.querySelectorAll('.char');

    // Set up stroke dash arrays
    [outer, inner, trace].forEach(function(el) {
      var len = el.getTotalLength();
      el.style.strokeDasharray = len;
      el.style.strokeDashoffset = len;
    });

    // Phase 1: Outer stroke draws in (0–1.2s)
    tl.to(outer, { opacity: 1, duration: 0.01 }, 0)
      .to(outer, { strokeDashoffset: 0, duration: 1.2, ease: 'expo.inOut' }, 0);

    // Phase 1b: Inner stroke draws in (0.5–1.5s)
    tl.to(inner, { opacity: 1, duration: 0.01 }, 0.5)
      .to(inner, { strokeDashoffset: 0, duration: 1.0, ease: 'expo.inOut' }, 0.5);

    // Phase 2: Signal trace sweeps (1.0–2.2s)
    tl.to(trace, { opacity: 1, duration: 0.01 }, 1.0)
      .to(trace, { strokeDashoffset: 0, duration: 1.2, ease: 'power2.inOut' }, 1.0);

    // Phase 3: Peak dot blooms (2.0s)
    tl.to(dot, { opacity: 1, duration: 0.01 }, 2.0)
      .fromTo(dot, { attr: { r: 0 } }, { attr: { r: 4 }, duration: 0.4, ease: 'back.out(2)' }, 2.0)
      .to(dot, { attr: { r: 3.5 }, duration: 0.8, ease: 'elastic.out(1, 0.5)' }, 2.4);

    // Phase 4: Logotype types in (2.4–3.2s)
    tl.to('.logotype', { opacity: 1, duration: 0.01 }, 2.4);
    chars.forEach(function(ch, i) {
      tl.fromTo(ch, { opacity: 0, y: 4 }, { opacity: 1, y: 0, duration: 0.12, ease: 'expo.out' }, 2.4 + i * 0.08);
    });

    // Total: ~3.2s — does not loop
  </script>
</body>
</html>
